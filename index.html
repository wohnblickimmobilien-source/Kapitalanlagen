<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Farbe der iOS-Statusleiste. Muss exakt dem INK-Wert in den JSX-Dateien
         entsprechen, sonst entsteht oben eine sichtbare Kante. -->
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Vermögenskompass – Wohnblick Immobilien</title>
    <style>
      html,body{background:#0A0A0B;margin:0;-webkit-text-size-adjust:100%;}
      /* Verhindert, dass beim Gummiband-Scrollen oben oder unten eine
         andersfarbige Fläche aufblitzt. */
      html{background-color:#0A0A0B;}
      /* viewport-fit=cover zieht den Inhalt im Querformat unter die Notch,
         darum die seitlichen Safe-Area-Abstände am Body abfangen. */
      body{-webkit-tap-highlight-color:transparent;
        padding-left:env(safe-area-inset-left);
        padding-right:env(safe-area-inset-right);}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
